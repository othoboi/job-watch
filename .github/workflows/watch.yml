That’s normal. Empty alerts.md just means nothing new has been posted since the baseline a few minutes ago.

The 306 errors come from the second run, because I forgot to tell you to add --workers 8 to the normal command. Without it the script hits the sites too fast and gets blocked. Nothing is lost, since blocked boards just get checked on the next run, but you’d miss alerts in the meantime.

From now on, the only command you need is:

python3 watch.py --workers 8

Run it once a day, ideally in the morning. If alerts.md has entries, send it to me and I’ll sort out which are worth applying to.

The 109 boards that fail every time are dead links. Ignore them.

