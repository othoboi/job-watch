Ran a command, created a file

Yes, but only once you set it up on GitHub. Right now it’s only on your laptop, so nothing runs by itself. After setup, GitHub runs it every 15 to 20 minutes for the fast boards and hourly for Workday. It sends a push to your phone for anything new, and you never touch the terminal again.

One-time setup, about 10 minutes:

    Phone: install the free ntfy app and subscribe to a long random topic name, for example aasrith-jobs-8f3k29x1q7. Anyone who knows the name could read your alerts, so keep it private.
    GitHub: create a new repository. Make it public, because a private one runs out of free minutes. It only contains job postings, nothing personal.
    Upload your whole job-watch folder to that repo. Include seen.json, the file from your last run. That is your baseline, so you can skip the baseline step.
    Replace the workflow file. In the repo, replace .github/workflows/watch.yml with the one I just made. It adds --workers 8, which stops the rate-limit errors.
    Add the secret. Go to Settings → Secrets and variables → Actions → New secret. Name it NTFY_TOPIC and set it to the topic name from step 1.
    Test it. Go to the Actions tab, pick job-watch, and click Run workflow. It should finish green in a couple of minutes.

GitHub’s timing is approximate, so alerts can arrive 5 to 20 minutes after a posting goes up. That’s fine for this.

If you get stuck on any step, tell me which one and what you see.
